name: Playwright CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.12.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        id: install-browsers
        run: npx playwright install --with-deps chromium

      # Each test group writes to its own report and results folder so the BDD run
      # does not overwrite the functional results.
      - name: Run functional tests in Chromium
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/functional
        run: npx playwright test --project=chromium --output=test-results/functional

      - name: Generate Gherkin tests
        if: ${{ !cancelled() && steps.install-browsers.outcome == 'success' }}
        run: npm run bdd:generate

      - name: Run AE-04 Gherkin test in Chromium
        if: ${{ !cancelled() && steps.install-browsers.outcome == 'success' }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/bdd
        run: npx playwright test --project=bdd-chromium --grep "Search for an existing product" --output=test-results/bdd

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-html-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
